# Input file for the Epidemic model to test the Epistorm contact survey

# === Model parameters
nsim: 100   # Number of independent runs with the same parameter
seed: 2450  # Seed of the first simulation.

model_nsteps_max: 800
model_dt: 1.0
model_beta: 0.0583
model_use_r0: 1.5  # If defined, replaces beta to achieve this reproduction number
model_gamma: 0.333
model_initial_mode: "fraction"
model_initial_infec_fraction: 1.E-5
model_initial_infec_age: 45  # Just a single age in which first infectious are initialized

# -()- Epistorm matrix
age_structure_fpath: "data/age_distributions/singleyr-age-dist_100.csv"
contact_matrix_fpath: "data/survey_epistorm/g4-matrix.csv"
contact_matrix_age_groups: [0, 3, 7, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 75]
cm_has_header: True
cm_has_index: True
cm_transpose: False

do_export: True
do_export_individual_sims: True
export_incidence: True