# Input file for the Epidemic model to test the Epistorm contact survey


# === Model parameters
nsim: 10   # Number of independent runs with the same parameter
seed: 10  # Seed of the first simulation.

model_nsteps_max: 800
model_dt: 1.0
model_beta: 0.020
model_gamma: 0.14
model_initial_infec: 100
model_initial_infec_age: 30  # Just a single age in which first infectious are initialized

# -()- Mistry Matrices – First test
age_structure_fpath: "data/age_distributions/singleyr-age-dist_100.csv"
contact_matrix_fpath: "data/mistry-2021/contact_matrices/United_States_country_level_M_overall_contact_matrix_18.csv"
contact_matrix_age_groups: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 75, 80, 85]

