# Input file for the Epidemic model to test the Epistorm contact survey


# === Model parameters
nsim: 100   # Number of independent runs with the same parameter
seed: 2456  # Seed of the first simulation.

model_nsteps_max: 800
model_dt: 1.0
model_beta: 0.0583
model_use_r0: 1.5  # If defined, replaces beta to achieve this reproduction number
model_gamma: 0.333
model_initial_mode: "fraction"
model_initial_infec_fraction: 1.E-5
model_initial_infec_age: 0  # Race ethnicity to start with: 0 = White.

override_total_pop: 10000000  # Rescale the population size to match this value

# -()- Matrix and population distribution by race/ethnicity
colname_age: "race_ethnicity"
age_structure_fpath: "../../data/math-model_data/race-ethn_distributions/population_us_raceth.csv"
contact_matrix_fpath: "../../data/math-model_data/survey_epistorm/Total-M-race-matrix.csv"
contact_matrix_age_groups: [0, 1, 2, 3, 4]
cm_has_header: True
cm_has_index: True
cm_transpose: False

do_export: True
do_export_individual_sims: True
export_incidence: True