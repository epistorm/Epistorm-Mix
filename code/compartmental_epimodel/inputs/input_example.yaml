# Input file for the Epidemic model to test the Epistorm contact survey.

# === Model parameters
nsim: 10   # Number of independent runs with the same parameter
seed: 42  # Seed of the first simulation.

model_nsteps_max: 800
model_dt: 1.0
model_beta: 0.090
model_gamma: 0.333
model_initial_mode: "fraction"
model_initial_infec_fraction: 1.E-5
model_initial_infec_age: 45  # Just a single age in which first infectious are initialized

# -()- Epistorm matrix
age_structure_fpath: "data/age_distributions/singleyr-age-dist_100.csv"
contact_matrix_fpath: "data/survey_epistorm/ageby5_80-matrix.csv"
contact_matrix_age_groups: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 75, 80]
cm_has_header: True
cm_has_index: True
cm_transpose: False

do_export: True
do_export_individual_sims: True
export_incidence: True